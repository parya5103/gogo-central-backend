# GoGo Central Backend — Cloud Run service manifest
#
# Deploy with:
#   gcloud run services replace deploy/cloudrun/service.yaml
# after filling every <PLACEHOLDER> below, or use scripts/deploy-cloudrun.sh
# which deploys with gcloud flags (recommended: it wires Secret Manager
# mounts, which a plain services replace cannot express).
#
# Cost posture: min-scale 0 (scales to zero, billed nothing while idle),
# 512Mi / 1 CPU, max 3 instances. Cloud Run requires a billing account on
# the project even when usage stays inside the free tier.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: gogo-central-backend
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Scale to zero: no traffic -> no cost.
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: app
          # e.g. asia-south1-docker.pkg.dev/<PROJECT_ID>/gogo-central/backend:latest
          image: <REGION>-docker.pkg.dev/<PROJECT_ID>/gogo-central/backend:latest
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            # Start with "true" (dry-run receipts only); flip to "false" for
            # real FCM delivery after end-to-end verification.
            - name: FCM_DRY_RUN
              value: "false"
            - name: SQL_HOST
              value: <NEON_HOST>   # e.g. ep-cool-name-123456.aws.neon.tech
            - name: SQL_PORT
              value: "5432"
            - name: SQL_DB_NAME
              value: <NEON_DATABASE>  # e.g. neondb
            - name: SQL_USER
              value: <NEON_USER>
            - name: SQL_PASSWORD
              value: <FROM_SECRET_MANAGER>  # use gcloud --set-secrets instead of plaintext
            # Comma-separated extra origins if the frontend is served elsewhere.
            - name: CORS_ALLOWED_ORIGINS
              value: ""
          resources:
            limits:
              memory: 512Mi
              cpu: "1"
          startupProbe:
            httpGet:
              path: /api/v1/health/live
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
