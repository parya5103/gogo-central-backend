services:
  postgres:
    image: postgres:18-alpine
    container_name: gogo-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gogo_central
      POSTGRES_USER: gogo_app_user
      POSTGRES_PASSWORD: local_dev_only_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - gogo_pg_data:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogo_app_user -d gogo_central"]
      interval: 5s
      timeout: 5s
      retries: 5

  gogo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gogo-central-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      PG_PROVIDER: local
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_DB_NAME: gogo_central
      SQL_USER: gogo_app_user
      SQL_PASSWORD: local_dev_only_password_change_in_prod
      CORS_ALLOWED_ORIGINS: "https://gogocompany.in,http://localhost:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  gogo_pg_data:
