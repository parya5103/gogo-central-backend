services:
  postgres:
    image: postgres:18-alpine
    container_name: gogo-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gogo_central
      POSTGRES_USER: gogo_app_user
      POSTGRES_PASSWORD: local_dev_only_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 images store data in version-specific subdirectories, so
      # the canonical mount point is /var/lib/postgresql (NOT .../data —
      # mounting data/ makes postgres 18 refuse to start). See
      # https://github.com/docker-library/postgres/pull/1259
      - gogo_pg_data:/var/lib/postgresql
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gogo_app_user -d gogo_central"]
      interval: 5s
      timeout: 5s
      retries: 5

  gogo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gogo-central-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Production mode: sandbox role headers are always rejected here, and the
      # diagnostic self-test endpoint is disabled.
      NODE_ENV: production
      PORT: 3000
      PG_PROVIDER: local
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_DB_NAME: gogo_central
      SQL_USER: gogo_app_user
      SQL_PASSWORD: local_dev_only_password_change_in_prod
      CORS_ALLOWED_ORIGINS: "https://gogocompany.in,http://localhost:3000"
      # Explicit defense-in-depth: sandbox auth headers stay disabled even in
      # local containers. Set to "true" only for manual sandbox-header testing.
      GOGO_ENABLE_SANDBOX_AUTH: "false"
      # FCM_DRY_RUN=true validates FCM requests without delivering pushes.
      # Requires valid Firebase credentials either way; set to "false" once
      # real delivery is intended and credentials are configured.
      FCM_DRY_RUN: "true"
    healthcheck:
      # Readiness probe: verifies the HTTP layer AND live PostgreSQL
      # connectivity (503 while the database is unreachable).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  gogo_pg_data:
